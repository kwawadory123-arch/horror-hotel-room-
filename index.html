function clearPeers(){Object.values(peers).forEach(p=>{if(p.g&&p.g.parent)p.g.parent.remove(p.g)});peers={}}

function sendPos(f){if(mode=='home')return;if(!f&&!Object.keys(peers).length&&room==RID)return;const L=mode=='lobby',m=L?'l':(mode=='game'||mode=='trans')?'g':'r',x=L?lp.x:pos.x,z=L?lp.z:pos.z;
 send({t:'p',u:uid(),n:D.name,s:D.skin,l:D.lv,m,st,x,z,r:me.rotation.y,j:jy,v:Math.hypot(x-px_,z-pz_)>.01?1:0});px_=x;pz_=z}
function onMsg(m){if(!m)return;
 if(m.t=='p'){if(m.u==uid())return;let p=peers[m.u];if(!p){if(Object.keys(peers).length>=5)return;p=peers[m.u]={u:m.u,g:null,s:-1,d:0,first:1};toast('👥 '+m.n+' が参加しました');sendPos(1)}
  Object.assign(p,{n:m.n,l:m.l,m:m.m,st:m.st,tx:m.x,tz:m.z,tr:m.r,j:m.j,v:m.v,t:performance.now()});
  if(m.s!=p.s){p.s=m.s;if(p.g&&p.g.parent)p.g.parent.remove(p.g);p.g=av(SKN[m.s]?m.s:0);label(p.g,m.n,2.6);p.ln=m.n;p.first=1}
  // 名前変更をすぐ反映 / ロビーに戻ったら横倒しを解除
  if(p.g&&p.ln!==m.n){p.ln=m.n;label(p.g,m.n,2.6)}
  if(m.m!='g')p.d=0}
 else if(m.t=='start'){if(mode=='lobby'&&room!=RID){SEEDV=m.seed;df=m.df;SE.btn();start(0)}}
 else if(m.t=='clear'){if(mode=='game'&&m.st==st)stageClear()}
 else if(m.t=='em'){const p=peers[m.u];if(p&&p.g&&p.g.parent)bubble(p.g,m.e);if(m.e=='📍'&&mode=='game'&&m.st==st){addPing(m.x,m.z);toast('📍 '+m.n+' がここを指しています')}}
 else if(m.t=='dead'){const p=peers[m.u];if(p)p.d=1}
 else if(m.t=='bye'){const p=peers[m.u];if(p){if(p.g&&p.g.parent)p.g.parent.remove(p.g);delete peers[m.u];toast('👋 '+(p.n||'')+' が退出')}}}
function peersTick(dt,t){const now=performance.now();
 for(const k in peers){const p=peers[k];if(now-p.t>4000){if(p.g&&p.g.parent)p.g.parent.remove(p.g);delete peers[k];toast('👋 '+p.n+' が退出');continue}if(!p.g)continue;
  const gp=p.m=='l'&&mode=='lobby'?lobby:p.m=='g'&&p.st==st&&(mode=='game'||mode=='trans')?hotel:null;
  if(p.g.parent!=gp){if(p.g.parent)p.g.parent.remove(p.g);if(gp){gp.add(p.g);p.first=1}}if(!gp)continue;
  const g=p.g;if(p.first){g.position.set(p.tx,0,p.tz);p.first=0}const q=Math.min(1,dt*10);g.position.x+=(p.tx-g.position.x)*q;g.position.z+=(p.tz-g.position.z)*q;g.position.y=p.j||0;g.rotation.y=p.tr;g.rotation.z=p.d?1.3:0;
  anim(g,p.v&&!p.d,t);trail(g,dt,p.v&&!p.d)}}

 setTimeout(()=>{if(room==r&&!Object.keys(peers).length&&mode=='lobby'){toast('部屋が見つかりません。ホストが退出した可能性があります');joinRoom(RID)}},7000)}

addEventListener('pagehide',()=>send({t:'bye',u:uid()}));

const EMO=['👍','😂','😱','🙏','❤️','📍'];let emT=0;
function bubble(o,e){if(o.userData.bub)o.remove(o.userData.bub);const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.font='96px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,64,70);
 const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true,depthTest:false,fog:false}));s.scale.set(1.3,1.3,1);s.position.y=3.2;s.renderOrder=10;o.add(s);o.userData.bub=s;setTimeout(()=>{if(o.userData.bub===s){o.remove(s);o.userData.bub=null}},3000)}

 const b=new T.Mesh(new T.CylinderGeometry(.12,.12,3.4,8,1,true),new T.MeshBasicMaterial({color:0xffee00,transparent:true,opacity:.5,fog:false}));b.position.y=1.7;g.add(r,b);g.position.set(x,0,z);hotel.add(g);const p={x,z};pings.push(p);setTimeout(()=>{hotel.remove(g);pings=pings.filter(q=>q!==p)},9000)}

 if(mode=='home'){base.rotation.y+=dt*.6;pts.rotation.y=t*.03;pts.position.y=Math.sin(t*.5)*.2;me.position.set(-1.4,Math.sin(t*2)*.03,0);me.rotation.y=.5+Math.sin(t*.5)*.15;u.hd.rotation.y=Math.sin(t*.8)*.25;

 else if(mode=='game')game(dt,t);

 C.position.copy(camP);if(shk>0){C.position.x+=rnd(-1,1)*shk;C.position.y+=rnd(-1,1)*shk*.6;shk=Math.max(0,shk-dt*1.5)}C.lookAt(camL);R.render(S,C)}
